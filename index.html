<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Noise Engine</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#040805" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noise Engine">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">

    <style>
        :root {
            --bg-main: #040805;
            --bg-surface: #08110b;
            --bg-elevated: #0e1e13;
            --border-subtle: rgba(57, 255, 20, 0.25);
            --text-primary: #eaffef;
            --text-muted: #6f9c7b;
            --neon: #39ff14;
            --neon-bg: rgba(57, 255, 20, 0.14);
            --neon-glow: rgba(57, 255, 20, 0.45);
            --accent-red: #ff2a5f;
            --red-glow: rgba(255, 42, 95, 0.45);
        }

        [data-theme="light"] {
            --bg-main: #edf5ef;
            --bg-surface: #ffffff;
            --bg-elevated: #dcece0;
            --border-subtle: rgba(0, 168, 62, 0.28);
            --text-primary: #07210f;
            --text-muted: #4b7257;
            --neon: #00c846;
            --neon-bg: rgba(0, 200, 70, 0.14);
            --neon-glow: rgba(0, 200, 70, 0.35);
            --accent-red: #e11d48;
            --red-glow: rgba(225, 29, 72, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 10px 14px;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.live {
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon);
        }

        .brand-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bg-pill-btn {
            height: 36px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }

        .bg-pill-btn.active {
            background: var(--neon-bg);
            color: var(--neon);
            border-color: var(--neon);
            box-shadow: 0 0 8px var(--neon-glow);
        }

        .icon-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 15px;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        /* INFO CARD */
        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 18px;
        }

        .info-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .info-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .info-title {
            font-size: 1.38rem;
            font-weight: 800;
            margin: 0;
        }

        .info-subtitle {
            color: var(--text-muted);
            font-size: 0.84rem;
            margin: 4px 0 0;
        }

        /* STATIC NEON BARS */
        .neon-eq {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 26px;
            padding: 2px 4px;
        }

        .neon-eq span {
            width: 4px;
            border-radius: 999px;
            background: var(--text-muted);
        }

        .neon-eq span:nth-child(1) { height: 10px; }
        .neon-eq span:nth-child(2) { height: 18px; }
        .neon-eq span:nth-child(3) { height: 24px; }
        .neon-eq span:nth-child(4) { height: 15px; }
        .neon-eq span:nth-child(5) { height: 11px; }

        .neon-eq.live span {
            background: var(--neon);
            box-shadow: 0 0 6px var(--neon);
        }

        /* CONTROL CARD */
        .panel-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 10px;
        }

        .noise-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-noise {
            background: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 12px 6px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
        }

        .btn-noise.active {
            background: var(--neon-bg);
            color: var(--neon);
            border-color: var(--neon);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .value-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--neon);
            background: var(--bg-elevated);
            padding: 3px 9px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        /* LIGHTWEIGHT NEON SLIDERS (NO HEAVY GPU REPAINTS) */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--neon);
            border: 3px solid var(--bg-surface);
            box-shadow: 0 0 8px var(--neon);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--neon);
            border: 3px solid var(--bg-surface);
            box-shadow: 0 0 8px var(--neon);
            cursor: pointer;
        }

        /* PLAY BUTTON */
        .btn-toggle {
            width: 100%;
            background: var(--neon);
            color: #040805;
            border: 1px solid var(--neon);
            padding: 16px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 12px var(--neon-glow);
        }

        .btn-toggle.playing {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 0 12px var(--red-glow);
        }

        .bg-hint {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand-badge">
                <span class="status-dot" id="status-dot"></span>
                <span class="brand-title">NOISE ENGINE</span>
            </div>
            <div class="top-actions">
                <button class="bg-pill-btn active" id="bg-mode-btn" title="Background lock-screen anchor">BG: ON</button>
                <button class="icon-action-btn" id="theme-toggle-btn" title="Toggle theme">☀️</button>
            </div>
        </header>

        <!-- HEADER CARD -->
        <section class="info-card">
            <div class="info-top">
                <span id="status-badge">STANDBY • PWA</span>
                <span id="filter-readout">LPF 1000 HZ</span>
            </div>
            <div class="info-header-row">
                <div>
                    <h1 class="info-title">Noise Generator</h1>
                    <p class="info-subtitle">Soft background sound for focus and rest</p>
                </div>
                <div class="neon-eq" id="neon-eq" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </section>

        <!-- CONTROLS -->
        <main class="panel-card">
            <div>
                <div class="section-label">Noise Type</div>
                <div class="noise-types">
                    <button class="btn-noise active" data-type="brown">Brown</button>
                    <button class="btn-noise" data-type="pink">Pink</button>
                    <button class="btn-noise" data-type="white">White</button>
                </div>
            </div>

            <div>
                <div class="section-label">Softness Controls</div>

                <div class="control-group" style="margin-bottom: 18px;">
                    <label for="cutoff">
                        <span>Cutoff Frequency</span>
                        <span id="cutoff-val" class="value-pill">1000 Hz</span>
                    </label>
                    <input type="range" id="cutoff" min="200" max="1500" step="10" value="1000">
                </div>

                <div class="control-group" style="margin-bottom: 18px;">
                    <label for="resonance">
                        <span>Resonance (Density)</span>
                        <span id="resonance-val" class="value-pill">1.0</span>
                    </label>
                    <input type="range" id="resonance" min="0.1" max="10" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <label for="volume">
                        <span>Volume</span>
                        <span id="volume-val" class="value-pill">50%</span>
                    </label>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>

            <button id="togglePlay" class="btn-toggle">▶ Start Noise</button>
        </main>

        <div class="bg-hint">NEON ENGINE V5 • CLEAN AUDIO</div>
    </div>

    <!-- Optional silent anchor for lock-screen playback -->
    <audio id="bg-keepalive" loop playsinline preload="none"></audio>

    <script>
        // --- PWA Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        // --- UI Elements ---
        const toggleBtn = document.getElementById('togglePlay');
        const cutoffInput = document.getElementById('cutoff');
        const resonanceInput = document.getElementById('resonance');
        const volumeInput = document.getElementById('volume');
        const cutoffVal = document.getElementById('cutoff-val');
        const resonanceVal = document.getElementById('resonance-val');
        const volumeVal = document.getElementById('volume-val');
        const filterReadout = document.getElementById('filter-readout');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const neonEq = document.getElementById('neon-eq');
        const themeBtn = document.getElementById('theme-toggle-btn');
        const bgModeBtn = document.getElementById('bg-mode-btn');
        const metaThemeColor = document.getElementById('meta-theme-color');
        const bgKeepAlive = document.getElementById('bg-keepalive');

        const NOISE_LABELS = {
            brown: 'Brown Noise',
            pink: 'Pink Noise',
            white: 'White Noise'
        };

        let audioCtx = null;
        let noiseSource = null;
        let filterNode = null;
        let gainNode = null;
        const bufferCache = {}; // Cached 5s buffers => 0ms switching, zero stutter
        let keepAliveReady = false;
        let isPlaying = false;
        let currentNoiseType = localStorage.getItem('noise_type') || 'brown';
        let bgAnchorEnabled = localStorage.getItem('noise_bg_anchor') !== 'off';

        function updateBgBtn() {
            bgModeBtn.textContent = bgAnchorEnabled ? 'BG: ON' : 'BG: OFF';
            bgModeBtn.classList.toggle('active', bgAnchorEnabled);
        }
        updateBgBtn();

        bgModeBtn.addEventListener('click', () => {
            bgAnchorEnabled = !bgAnchorEnabled;
            localStorage.setItem('noise_bg_anchor', bgAnchorEnabled ? 'on' : 'off');
            updateBgBtn();
            if (isPlaying) {
                if (bgAnchorEnabled) {
                    initKeepAliveWav(audioCtx ? audioCtx.sampleRate : 48000);
                    bgKeepAlive.play().catch(() => {});
                } else {
                    bgKeepAlive.pause();
                }
            }
        });

        // --- Lightweight 15s Silent WAV matching AudioContext sampleRate ---
        function initKeepAliveWav(sampleRate) {
            if (keepAliveReady) return;
            const sr = sampleRate || 48000;
            const numSamples = sr * 15;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sr, true);
            view.setUint32(28, sr * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            const blob = new Blob([buffer], { type: 'audio/wav' });
            bgKeepAlive.src = URL.createObjectURL(blob);
            bgKeepAlive.volume = 0.01;
            keepAliveReady = true;
        }

        // --- Theme Toggle ---
        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙';
                metaThemeColor.setAttribute('content', '#edf5ef');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = '☀️';
                metaThemeColor.setAttribute('content', '#040805');
            }
            localStorage.setItem('noise_theme', theme);
        }

        applyTheme(localStorage.getItem('noise_theme') || 'dark');

        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            applyTheme(isLight ? 'dark' : 'light');
        });

        // --- Restore Saved Settings ---
        function restoreSettings() {
            const savedCutoff = localStorage.getItem('noise_cutoff');
            const savedRes = localStorage.getItem('noise_resonance');
            const savedVol = localStorage.getItem('noise_volume');

            if (savedCutoff) cutoffInput.value = Math.min(1500, Math.max(200, parseFloat(savedCutoff)));
            if (savedRes) resonanceInput.value = savedRes;
            if (savedVol) volumeInput.value = savedVol;

            cutoffVal.textContent = cutoffInput.value + ' Hz';
            filterReadout.textContent = `LPF ${cutoffInput.value} HZ`;
            resonanceVal.textContent = parseFloat(resonanceInput.value).toFixed(1);
            volumeVal.textContent = Math.round(volumeInput.value * 100) + '%';

            document.querySelectorAll('.btn-noise').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === currentNoiseType);
            });
        }
        restoreSettings();

        // --- Media Session API (Called ONLY on start/stop/type-change, never while dragging) ---
        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: NOISE_LABELS[currentNoiseType] || 'Noise Generator',
                artist: `Cutoff ${cutoffInput.value} Hz`,
                album: 'Noise Engine'
            });
            navigator.mediaSession.setActionHandler('play', () => {
                if (!isPlaying) startAudio();
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                if (isPlaying) stopAudio();
            });
            navigator.mediaSession.setActionHandler('stop', () => {
                if (isPlaying) stopAudio();
            });
        }

        // --- Lightweight Cached 5s Buffer (Matches Original Simplicity + Smooth Loop) ---
        function getNoiseBuffer(ctx, type) {
            if (bufferCache[type]) return bufferCache[type];

            const bufferSize = 5 * ctx.sampleRate;
            const fadeSamples = Math.floor(0.08 * ctx.sampleRate); // 80ms crossfade
            const rawLen = bufferSize + fadeSamples;
            const raw = new Float32Array(rawLen);

            if (type === 'white') {
                for (let i = 0; i < rawLen; i++) {
                    raw[i] = (Math.random() * 2 - 1) * 0.6;
                }
            } else if (type === 'pink') {
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < rawLen; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    raw[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.09;
                    b6 = white * 0.115926;
                }
            } else {
                let lastOut = 0.0;
                for (let i = 0; i < rawLen; i++) {
                    const white = Math.random() * 2 - 1;
                    lastOut = (lastOut + (0.02 * white)) / 1.02;
                    raw[i] = lastOut * 2.5;
                }
            }

            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = raw[i];
            }
            for (let i = 0; i < fadeSamples; i++) {
                const t = i / fadeSamples;
                output[i] = output[i] * t + raw[bufferSize + i] * (1 - t);
            }

            bufferCache[type] = buffer;
            return buffer;
        }

        function setUiPlaying(playing) {
            isPlaying = playing;
            toggleBtn.textContent = playing ? '■ Stop Noise' : '▶ Start Noise';
            toggleBtn.classList.toggle('playing', playing);
            statusDot.classList.toggle('live', playing);
            neonEq.classList.toggle('live', playing);
            statusBadge.textContent = playing ? 'ACTIVE' : 'STANDBY • PWA';
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }

        function startAudio() {
            if ('audioSession' in navigator) {
                try { navigator.audioSession.type = 'playback'; } catch (_) {}
            }

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (bgAnchorEnabled) {
                initKeepAliveWav(audioCtx.sampleRate);
                bgKeepAlive.play().catch(() => {});
            }

            if (!filterNode) {
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
            }
            filterNode.frequency.setValueAtTime(parseFloat(cutoffInput.value), audioCtx.currentTime);
            filterNode.Q.setValueAtTime(parseFloat(resonanceInput.value), audioCtx.currentTime);

            if (!gainNode) {
                gainNode = audioCtx.createGain();
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            }
            gainNode.gain.setValueAtTime(parseFloat(volumeInput.value), audioCtx.currentTime);

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = getNoiseBuffer(audioCtx, currentNoiseType);
            noiseSource.loop = true;
            noiseSource.connect(filterNode);
            noiseSource.start(0);

            setUiPlaying(true);
            updateMediaSession();
        }

        function stopAudio() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch (_) {}
                noiseSource.disconnect();
                noiseSource = null;
            }
            bgKeepAlive.pause();
            setUiPlaying(false);
        }

        function recreateNoise() {
            if (!audioCtx || !filterNode) return;
            if (noiseSource) {
                try { noiseSource.stop(); } catch (_) {}
                noiseSource.disconnect();
            }
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = getNoiseBuffer(audioCtx, currentNoiseType);
            noiseSource.loop = true;
            noiseSource.connect(filterNode);
            noiseSource.start(0);
            updateMediaSession();
        }

        // --- Control Handlers (Zero disk/IPC work during slider movement) ---
        document.querySelectorAll('.btn-noise').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-noise').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentNoiseType = e.currentTarget.dataset.type;
                localStorage.setItem('noise_type', currentNoiseType);
                if (isPlaying) recreateNoise();
            });
        });

        toggleBtn.addEventListener('click', () => {
            if (isPlaying) stopAudio();
            else startAudio();
        });

        cutoffInput.addEventListener('input', (e) => {
            const val = e.target.value;
            cutoffVal.textContent = val + ' Hz';
            filterReadout.textContent = `LPF ${val} HZ`;
            if (filterNode && audioCtx) {
                filterNode.frequency.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.05);
            }
        });
        cutoffInput.addEventListener('change', (e) => {
            localStorage.setItem('noise_cutoff', e.target.value);
            if (isPlaying) updateMediaSession();
        });

        resonanceInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            resonanceVal.textContent = val.toFixed(1);
            if (filterNode && audioCtx) {
                filterNode.Q.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            }
        });
        resonanceInput.addEventListener('change', (e) => {
            localStorage.setItem('noise_resonance', e.target.value);
        });

        volumeInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            volumeVal.textContent = Math.round(val * 100) + '%';
            if (gainNode && audioCtx) {
                gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            }
        });
        volumeInput.addEventListener('change', (e) => {
            localStorage.setItem('noise_volume', e.target.value);
        });
    </script>
</body>
</html>
