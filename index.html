<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Noise Engine</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#040805" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Noise Engine">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">

    <style>
        :root {
            --bg-main: #040805;
            --bg-surface: #08110b;
            --bg-elevated: #0e1e13;
            --border-subtle: rgba(57, 255, 20, 0.22);
            --text-primary: #eaffef;
            --text-muted: #6f9c7b;
            --neon: #39ff14;
            --neon-soft: #00ff66;
            --neon-bg: rgba(57, 255, 20, 0.13);
            --neon-glow: rgba(57, 255, 20, 0.55);
            --neon-glow-strong: rgba(57, 255, 20, 0.9);
            --accent-red: #ff2a5f;
            --red-glow: rgba(255, 42, 95, 0.65);
            --shadow-card: 0 12px 34px rgba(0, 0, 0, 0.7), 0 0 18px rgba(57, 255, 20, 0.08);
        }

        [data-theme="light"] {
            --bg-main: #edf5ef;
            --bg-surface: #ffffff;
            --bg-elevated: #dcece0;
            --border-subtle: rgba(0, 168, 62, 0.25);
            --text-primary: #07210f;
            --text-muted: #4b7257;
            --neon: #00c846;
            --neon-soft: #00e050;
            --neon-bg: rgba(0, 200, 70, 0.14);
            --neon-glow: rgba(0, 200, 70, 0.4);
            --neon-glow-strong: rgba(0, 200, 70, 0.7);
            --accent-red: #e11d48;
            --red-glow: rgba(225, 29, 72, 0.45);
            --shadow-card: 0 10px 26px rgba(7, 33, 15, 0.09);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(57, 255, 20, 0.09), transparent 55%);
            color: var(--text-primary);
            margin: 0;
            padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 10px 14px;
            box-shadow: var(--shadow-card);
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background-color 0.25s ease;
            will-change: transform, opacity;
        }

        .status-dot.live {
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon-glow-strong);
            animation: neonPulse 1.8s infinite ease-in-out;
        }

        @keyframes neonPulse {
            0%, 100% {
                transform: scale(0.95);
                opacity: 0.78;
            }
            50% {
                transform: scale(1.22);
                opacity: 1;
            }
        }

        .brand-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
        }

        .icon-action-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .icon-action-btn:hover {
            border-color: var(--neon);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        .icon-action-btn:active {
            transform: scale(0.94);
        }

        /* INFO CARD */
        .info-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow-card);
        }

        .info-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--neon);
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            text-shadow: 0 0 8px var(--neon-glow);
        }

        .info-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .info-title {
            font-size: 1.38rem;
            font-weight: 800;
            margin: 0;
        }

        .info-subtitle {
            color: var(--text-muted);
            font-size: 0.84rem;
            margin: 4px 0 0;
        }

        /* GPU-COMPOSITED GLOWING EQUALIZER BARS (ZERO LAYOUT THRASH) */
        .neon-eq {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 26px;
            padding: 2px 4px;
        }

        .neon-eq span {
            width: 4px;
            height: 24px;
            border-radius: 999px;
            background: var(--text-muted);
            transform-origin: bottom center;
            transform: scaleY(0.25);
            will-change: transform, opacity;
            transition: background-color 0.25s ease;
        }

        .neon-eq.live span {
            background: var(--neon);
            box-shadow: 0 0 8px var(--neon), 0 0 16px var(--neon-glow-strong);
            animation: eqWave 1.15s infinite ease-in-out;
        }

        .neon-eq.live span:nth-child(1) { animation-delay: 0.0s; }
        .neon-eq.live span:nth-child(2) { animation-delay: 0.18s; }
        .neon-eq.live span:nth-child(3) { animation-delay: 0.36s; }
        .neon-eq.live span:nth-child(4) { animation-delay: 0.12s; }
        .neon-eq.live span:nth-child(5) { animation-delay: 0.28s; }

        @keyframes eqWave {
            0%, 100% { transform: scaleY(0.28); opacity: 0.65; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* CONTROL CARD */
        .panel-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 10px;
        }

        .noise-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-noise {
            background: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 12px 6px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-noise:hover {
            color: var(--text-primary);
            border-color: var(--neon);
        }

        .btn-noise.active {
            background: var(--neon-bg);
            color: var(--neon);
            border-color: var(--neon);
            text-shadow: 0 0 8px var(--neon-glow);
            box-shadow: 0 0 14px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.18);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .value-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--neon);
            background: var(--bg-elevated);
            padding: 3px 9px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            text-shadow: 0 0 8px var(--neon-glow);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .control-group:focus-within .value-pill,
        .control-group.dragging .value-pill {
            border-color: var(--neon);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        /* GLOWING NEON SLIDERS */
        input[type="range"] {
            --fill: 50%;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(
                90deg,
                var(--neon) 0%,
                var(--neon-soft) var(--fill),
                var(--bg-elevated) var(--fill),
                var(--bg-elevated) 100%
            );
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.25), inset 0 0 4px rgba(0, 0, 0, 0.5);
            outline: none;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }

        input[type="range"]:hover,
        input[type="range"]:active {
            box-shadow: 0 0 16px var(--neon-glow);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--neon);
            border: 3px solid var(--bg-surface);
            box-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon-glow-strong);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            transform: scale(1.1);
            box-shadow: 0 0 14px var(--neon), 0 0 28px var(--neon-glow-strong);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.22);
            box-shadow: 0 0 18px var(--neon), 0 0 36px var(--neon-glow-strong);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--neon);
            border: 3px solid var(--bg-surface);
            box-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon-glow-strong);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]:active::-moz-range-thumb {
            transform: scale(1.22);
            box-shadow: 0 0 18px var(--neon), 0 0 36px var(--neon-glow-strong);
        }

        /* PLAY BUTTON */
        .btn-toggle {
            width: 100%;
            background: var(--neon);
            color: #040805;
            border: 1px solid var(--neon);
            padding: 16px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 16px var(--neon-glow), 0 0 32px rgba(57, 255, 20, 0.28);
            transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .btn-toggle:hover {
            box-shadow: 0 0 22px var(--neon-glow-strong), 0 0 42px var(--neon-glow);
        }

        .btn-toggle:active {
            transform: scale(0.97);
        }

        .btn-toggle.playing {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 0 18px var(--red-glow), 0 0 34px rgba(255, 42, 95, 0.35);
        }

        .bg-hint {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand-badge">
                <span class="status-dot" id="status-dot"></span>
                <span class="brand-title">NOISE ENGINE</span>
            </div>
            <button class="icon-action-btn" id="theme-toggle-btn" title="Toggle theme">☀️</button>
        </header>

        <!-- HEADER CARD -->
        <section class="info-card">
            <div class="info-top">
                <span id="status-badge">STANDBY • PWA</span>
                <span id="filter-readout">LPF 1000 HZ</span>
            </div>
            <div class="info-header-row">
                <div>
                    <h1 class="info-title">Noise Generator</h1>
                    <p class="info-subtitle">Soft background sound with lock-screen playback</p>
                </div>
                <div class="neon-eq" id="neon-eq" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </section>

        <!-- CONTROLS -->
        <main class="panel-card">
            <div>
                <div class="section-label">Noise Type</div>
                <div class="noise-types">
                    <button class="btn-noise active" data-type="brown">Brown</button>
                    <button class="btn-noise" data-type="pink">Pink</button>
                    <button class="btn-noise" data-type="white">White</button>
                </div>
            </div>

            <div>
                <div class="section-label">Softness Controls</div>

                <div class="control-group" style="margin-bottom: 18px;">
                    <label for="cutoff">
                        <span>Cutoff Frequency</span>
                        <span id="cutoff-val" class="value-pill">1000 Hz</span>
                    </label>
                    <input type="range" id="cutoff" min="200" max="1500" step="10" value="1000">
                </div>

                <div class="control-group" style="margin-bottom: 18px;">
                    <label for="resonance">
                        <span>Resonance (Density)</span>
                        <span id="resonance-val" class="value-pill">1.0</span>
                    </label>
                    <input type="range" id="resonance" min="0.1" max="10" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <label for="volume">
                        <span>Volume</span>
                        <span id="volume-val" class="value-pill">50%</span>
                    </label>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>

            <button id="togglePlay" class="btn-toggle">▶ Start Noise</button>
        </main>

        <div class="bg-hint">LOCK-SCREEN AUDIO &amp; OFFLINE READY</div>
    </div>

    <!-- Hidden audio anchor to keep mobile background playback alive -->
    <audio id="bg-keepalive" loop playsinline preload="auto"></audio>

    <script>
        // --- PWA Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.warn('SW registration failed:', err);
                });
            });
        }

        // --- UI Elements ---
        const toggleBtn = document.getElementById('togglePlay');
        const cutoffInput = document.getElementById('cutoff');
        const resonanceInput = document.getElementById('resonance');
        const volumeInput = document.getElementById('volume');
        const cutoffVal = document.getElementById('cutoff-val');
        const resonanceVal = document.getElementById('resonance-val');
        const volumeVal = document.getElementById('volume-val');
        const filterReadout = document.getElementById('filter-readout');
        const statusBadge = document.getElementById('status-badge');
        const statusDot = document.getElementById('status-dot');
        const neonEq = document.getElementById('neon-eq');
        const themeBtn = document.getElementById('theme-toggle-btn');
        const metaThemeColor = document.getElementById('meta-theme-color');
        const bgKeepAlive = document.getElementById('bg-keepalive');

        const NOISE_LABELS = {
            brown: 'Brown Noise',
            pink: 'Pink Noise',
            white: 'White Noise'
        };

        let audioCtx = null;
        let noiseSource = null;
        let filterNode = null;
        let gainNode = null;
        let limiterNode = null;
        let isPlaying = false;
        let currentNoiseType = localStorage.getItem('noise_type') || 'brown';

        // --- Slider Neon Fill Helper ---
        function updateSliderFill(input) {
            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            const val = parseFloat(input.value);
            const pct = ((val - min) / (max - min)) * 100;
            input.style.setProperty('--fill', `${pct}%`);
        }

        [cutoffInput, resonanceInput, volumeInput].forEach(slider => {
            const group = slider.closest('.control-group');
            slider.addEventListener('pointerdown', () => group && group.classList.add('dragging'));
            window.addEventListener('pointerup', () => group && group.classList.remove('dragging'));
            slider.addEventListener('input', () => updateSliderFill(slider));
        });

        // --- Clean 44.1kHz 10s Silent WAV Keep-Alive Anchor (no resampling clicks) ---
        function createKeepAliveWavUrl() {
            const sampleRate = 44100;
            const numSamples = sampleRate * 10;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);
            // ArrayBuffer is already zero-initialized (pure digital silence)

            const blob = new Blob([buffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }

        bgKeepAlive.src = createKeepAliveWavUrl();
        bgKeepAlive.volume = 0.01;

        // --- Theme Toggle ---
        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙';
                metaThemeColor.setAttribute('content', '#edf5ef');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = '☀️';
                metaThemeColor.setAttribute('content', '#040805');
            }
            localStorage.setItem('noise_theme', theme);
        }

        applyTheme(localStorage.getItem('noise_theme') || 'dark');

        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            applyTheme(isLight ? 'dark' : 'light');
        });

        // --- Restore Saved Settings ---
        function restoreSettings() {
            const savedCutoff = localStorage.getItem('noise_cutoff');
            const savedRes = localStorage.getItem('noise_resonance');
            const savedVol = localStorage.getItem('noise_volume');

            if (savedCutoff) cutoffInput.value = Math.min(1500, Math.max(200, parseFloat(savedCutoff)));
            if (savedRes) resonanceInput.value = savedRes;
            if (savedVol) volumeInput.value = savedVol;

            cutoffVal.textContent = cutoffInput.value + ' Hz';
            filterReadout.textContent = `LPF ${cutoffInput.value} HZ`;
            resonanceVal.textContent = parseFloat(resonanceInput.value).toFixed(1);
            volumeVal.textContent = Math.round(volumeInput.value * 100) + '%';

            [cutoffInput, resonanceInput, volumeInput].forEach(updateSliderFill);

            document.querySelectorAll('.btn-noise').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === currentNoiseType);
            });
        }
        restoreSettings();

        // --- Media Session API (Lock Screen Controls) ---
        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;

            navigator.mediaSession.metadata = new MediaMetadata({
                title: NOISE_LABELS[currentNoiseType] || 'Noise Generator',
                artist: `Cutoff ${cutoffInput.value} Hz • Background Mode`,
                album: 'Noise Engine PWA'
            });

            navigator.mediaSession.setActionHandler('play', () => {
                if (!isPlaying) startAudio();
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                if (isPlaying) stopAudio();
            });
            navigator.mediaSession.setActionHandler('stop', () => {
                if (isPlaying) stopAudio();
            });
        }

        // --- Seamless, Normalized Noise Buffer (No Clipping, No Loop Click) ---
        function createNoiseBuffer(ctx, type) {
            const durationSec = 10;
            const bufferSize = durationSec * ctx.sampleRate;
            const fadeSamples = Math.floor(0.25 * ctx.sampleRate); // 250ms crossfade
            const rawLen = bufferSize + fadeSamples;
            const raw = new Float32Array(rawLen);

            if (type === 'white') {
                for (let i = 0; i < rawLen; i++) {
                    raw[i] = Math.random() * 2 - 1;
                }
            } else if (type === 'pink') {
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < rawLen; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    raw[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            } else {
                let lastOut = 0.0;
                for (let i = 0; i < rawLen; i++) {
                    const white = Math.random() * 2 - 1;
                    lastOut = (lastOut + (0.02 * white)) / 1.02;
                    raw[i] = lastOut;
                }
            }

            // Normalize peak to 0.75 so it never clips before or inside the filter
            let peak = 0.0001;
            for (let i = 0; i < rawLen; i++) {
                const abs = Math.abs(raw[i]);
                if (abs > peak) peak = abs;
            }
            const scale = 0.75 / peak;

            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                output[i] = raw[i] * scale;
            }

            // Equal-power crossfade tail into head for a 100% click-free loop
            for (let i = 0; i < fadeSamples; i++) {
                const t = i / fadeSamples;
                const fadeIn = Math.sin(t * Math.PI * 0.5);
                const fadeOut = Math.cos(t * Math.PI * 0.5);
                output[i] = output[i] * fadeIn + (raw[bufferSize + i] * scale) * fadeOut;
            }

            return buffer;
        }

        function setUiPlaying(playing) {
            isPlaying = playing;
            toggleBtn.textContent = playing ? '■ Stop Noise' : '▶ Start Noise';
            toggleBtn.classList.toggle('playing', playing);
            statusDot.classList.toggle('live', playing);
            neonEq.classList.toggle('live', playing);
            statusBadge.textContent = playing ? 'ACTIVE • BACKGROUND' : 'STANDBY • PWA';
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }

        function startAudio() {
            if ('audioSession' in navigator) {
                try { navigator.audioSession.type = 'playback'; } catch (_) {}
            }

            bgKeepAlive.play().catch(() => {});

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'playback'
                });
                audioCtx.onstatechange = () => {
                    if (isPlaying && audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(() => {});
                    }
                };
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(parseFloat(cutoffInput.value), audioCtx.currentTime);
            filterNode.Q.setValueAtTime(parseFloat(resonanceInput.value), audioCtx.currentTime);

            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(parseFloat(volumeInput.value), audioCtx.currentTime);

            // Soft limiter prevents digital crackle even at high resonance
            limiterNode = audioCtx.createDynamicsCompressor();
            limiterNode.threshold.setValueAtTime(-3, audioCtx.currentTime);
            limiterNode.knee.setValueAtTime(12, audioCtx.currentTime);
            limiterNode.ratio.setValueAtTime(12, audioCtx.currentTime);
            limiterNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
            limiterNode.release.setValueAtTime(0.15, audioCtx.currentTime);

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = createNoiseBuffer(audioCtx, currentNoiseType);
            noiseSource.loop = true;

            noiseSource.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(limiterNode);
            limiterNode.connect(audioCtx.destination);

            noiseSource.start(0);
            setUiPlaying(true);
            updateMediaSession();
        }

        function stopAudio() {
            if (noiseSource) {
                try { noiseSource.stop(); } catch (_) {}
                noiseSource.disconnect();
                noiseSource = null;
            }
            bgKeepAlive.pause();
            setUiPlaying(false);
        }

        function recreateNoise() {
            if (!audioCtx || !filterNode) return;
            if (noiseSource) {
                try { noiseSource.stop(); } catch (_) {}
                noiseSource.disconnect();
            }
            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = createNoiseBuffer(audioCtx, currentNoiseType);
            noiseSource.loop = true;
            noiseSource.connect(filterNode);
            noiseSource.start(0);
            updateMediaSession();
        }

        document.addEventListener('visibilitychange', () => {
            if (isPlaying) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                if (bgKeepAlive.paused) {
                    bgKeepAlive.play().catch(() => {});
                }
            }
        });

        // --- Control Handlers ---
        document.querySelectorAll('.btn-noise').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-noise').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentNoiseType = e.currentTarget.dataset.type;
                localStorage.setItem('noise_type', currentNoiseType);
                if (isPlaying) recreateNoise();
            });
        });

        toggleBtn.addEventListener('click', () => {
            if (isPlaying) stopAudio();
            else startAudio();
        });

        cutoffInput.addEventListener('input', (e) => {
            const val = e.target.value;
            cutoffVal.textContent = val + ' Hz';
            filterReadout.textContent = `LPF ${val} HZ`;
            localStorage.setItem('noise_cutoff', val);
            if (filterNode && audioCtx) {
                filterNode.frequency.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.05);
            }
            if (isPlaying) updateMediaSession();
        });

        resonanceInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            resonanceVal.textContent = val.toFixed(1);
            localStorage.setItem('noise_resonance', val);
            if (filterNode && audioCtx) {
                filterNode.Q.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            }
        });

        volumeInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            volumeVal.textContent = Math.round(val * 100) + '%';
            localStorage.setItem('noise_volume', val);
            if (gainNode && audioCtx) {
                gainNode.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
            }
        });
    </script>
</body>
</html>
